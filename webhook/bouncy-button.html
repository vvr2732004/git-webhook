<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncy Button Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --sky-top: #6dd5fa;
        --sky-mid: #b721ff;
        --sky-bottom: #ffb703;
        --card-start: rgba(255, 255, 255, 0.3);
        --card-end: rgba(255, 255, 255, 0.12);
        --button-start: #ff4d6d;
        --button-mid: #ff8a00;
        --button-end: #ffd166;
        --button-shadow: #9f2a66;
        --toggle-start: #34d399;
        --toggle-mid: #22c55e;
        --toggle-end: #15803d;
        --toggle-shadow: #166534;
        --blue-toggle-start: #60a5fa;
        --blue-toggle-mid: #2563eb;
        --blue-toggle-end: #1e3a8a;
        --blue-toggle-shadow: #1d4ed8;
        --text: #1f1147;
        --text-soft: #422f72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.55), transparent 22%),
          radial-gradient(circle at 80% 15%, rgba(255, 214, 102, 0.5), transparent 20%),
          radial-gradient(circle at 75% 80%, rgba(255, 77, 109, 0.35), transparent 24%),
          linear-gradient(135deg, var(--sky-top), var(--sky-mid) 52%, var(--sky-bottom));
        color: var(--text);
        transition: background 220ms ease;
      }

      body.green-mode {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.4), transparent 22%),
          radial-gradient(circle at 82% 14%, rgba(187, 247, 208, 0.35), transparent 22%),
          radial-gradient(circle at 72% 84%, rgba(34, 197, 94, 0.28), transparent 26%),
          linear-gradient(135deg, #d9f99d, #22c55e 48%, #14532d);
      }

      body.blue-mode {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.42), transparent 22%),
          radial-gradient(circle at 82% 16%, rgba(147, 197, 253, 0.36), transparent 22%),
          radial-gradient(circle at 70% 82%, rgba(56, 189, 248, 0.28), transparent 26%),
          linear-gradient(135deg, #dbeafe, #38bdf8 44%, #1d4ed8 72%, #172554);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(16px);
        opacity: 0.45;
        pointer-events: none;
      }

      body::before {
        width: 15rem;
        height: 15rem;
        top: 8%;
        left: 8%;
        background: linear-gradient(180deg, #ffffff, #ffd166);
      }

      body::after {
        width: 18rem;
        height: 18rem;
        right: -3rem;
        bottom: -2rem;
        background: linear-gradient(180deg, #ff7eb6, #7afcff);
      }

      .card {
        width: min(90vw, 28rem);
        padding: 2.25rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 2rem;
        background: linear-gradient(180deg, var(--card-start), var(--card-end));
        box-shadow: 0 1.5rem 4rem rgba(31, 17, 71, 0.24);
        backdrop-filter: blur(14px);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .feedback-panel {
        margin-top: 1.5rem;
        text-align: left;
      }

      .feedback-label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-soft);
      }

      .feedback-textarea {
        width: 100%;
        min-height: 7.5rem;
        padding: 0.95rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.55);
        border-radius: 1.2rem;
        resize: vertical;
        background:
          linear-gradient(rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.86)) padding-box,
          linear-gradient(
            135deg,
            #ff4d6d,
            #ff8a00 18%,
            #ffd166 34%,
            #22c55e 52%,
            #38bdf8 70%,
            #6366f1 85%,
            #b721ff
          ) border-box;
        color: var(--text);
        font: inherit;
        line-height: 1.45;
        box-shadow: inset 0 0.1rem 0.35rem rgba(31, 17, 71, 0.08);
      }

      .feedback-textarea:focus {
        outline: 3px solid rgba(255, 255, 255, 0.25);
        border-color: transparent;
        box-shadow:
          inset 0 0.1rem 0.35rem rgba(31, 17, 71, 0.08),
          0 0 0 0.25rem rgba(183, 33, 255, 0.12);
      }

      .feedback-textarea::placeholder {
        color: rgba(66, 47, 114, 0.72);
      }

      .feedback-meta {
        margin-top: 0.65rem;
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.92rem;
        color: var(--text-soft);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        letter-spacing: 0.03em;
        text-shadow: 0 0.25rem 1rem rgba(255, 255, 255, 0.35);
      }

      p {
        margin: 0 0 1.75rem;
        line-height: 1.5;
        color: var(--text-soft);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 1rem 2.4rem;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #fffdf6;
        background: linear-gradient(135deg, var(--button-start), var(--button-mid), var(--button-end));
        box-shadow:
          0 0.6rem 0 var(--button-shadow),
          0 1rem 2rem rgba(159, 42, 102, 0.32);
        cursor: pointer;
        transform: translateY(0);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        animation: bounce 1.6s ease-in-out infinite;
      }

      button:hover {
        transform: translateY(-0.2rem) scale(1.02);
        filter: saturate(1.12) brightness(1.03);
      }

      button:active {
        transform: translateY(0.35rem);
        box-shadow:
          0 0.18rem 0 var(--button-shadow),
          0 0.45rem 0.9rem rgba(159, 42, 102, 0.2);
      }

      .toggle-button {
        background: linear-gradient(135deg, var(--toggle-start), var(--toggle-mid), var(--toggle-end));
        box-shadow:
          0 0.6rem 0 var(--toggle-shadow),
          0 1rem 2rem rgba(21, 128, 61, 0.28);
        animation-duration: 1.9s;
      }

      .toggle-button:active {
        box-shadow:
          0 0.18rem 0 var(--toggle-shadow),
          0 0.45rem 0.9rem rgba(21, 128, 61, 0.18);
      }

      .blue-toggle-button {
        background: linear-gradient(
          135deg,
          var(--blue-toggle-start),
          var(--blue-toggle-mid),
          var(--blue-toggle-end)
        );
        box-shadow:
          0 0.6rem 0 var(--blue-toggle-shadow),
          0 1rem 2rem rgba(29, 78, 216, 0.28);
        animation-duration: 2.1s;
      }

      .blue-toggle-button:active {
        box-shadow:
          0 0.18rem 0 var(--blue-toggle-shadow),
          0 0.45rem 0.9rem rgba(29, 78, 216, 0.18);
      }

      .status {
        margin-top: 1.25rem;
        min-height: 1.5rem;
        font-weight: 600;
        color: var(--text-soft);
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        20% {
          transform: translateY(-0.35rem);
        }
        40% {
          transform: translateY(0);
        }
        60% {
          transform: translateY(-0.18rem);
        }
        80% {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bouncy Button</h1>
      <p>Colorful gradient prototype to test Jira issue to PR linking in this repository.</p>
      <div class="controls">
        <button id="bounceButton" type="button">Click Me</button>
        <button class="toggle-button" id="themeToggleButton" type="button">Go Green</button>
        <button class="blue-toggle-button" id="blueThemeToggleButton" type="button">Go Blue</button>
      </div>
      <div class="feedback-panel">
        <label class="feedback-label" for="feedbackTextarea">Tell us what the button should say</label>
        <textarea
          class="feedback-textarea"
          id="feedbackTextarea"
          name="feedback"
          maxlength="180"
          placeholder="Type a short note and the status message below will reflect it."
        ></textarea>
        <div class="feedback-meta">
          <span id="feedbackHint">Nothing typed yet.</span>
          <span id="feedbackCount">0 / 180</span>
        </div>
      </div>
      <div class="status" id="status">Waiting for the first click.</div>
    </main>
    <script>
      const button = document.getElementById("bounceButton");
      const themeToggleButton = document.getElementById("themeToggleButton");
      const blueThemeToggleButton = document.getElementById("blueThemeToggleButton");
      const feedbackTextarea = document.getElementById("feedbackTextarea");
      const feedbackHint = document.getElementById("feedbackHint");
      const feedbackCount = document.getElementById("feedbackCount");
      const status = document.getElementById("status");
      let clickCount = 0;
      let activeTheme = "default";

      function typedMessage() {
        return feedbackTextarea.value.trim();
      }

      function setStatusMessage(baseMessage) {
        const message = typedMessage();
        status.textContent = message ? `${baseMessage} Draft note: ${message}` : baseMessage;
      }

      function updateFeedbackState() {
        const message = typedMessage();
        feedbackCount.textContent = `${feedbackTextarea.value.length} / 180`;

        if (!message) {
          feedbackHint.textContent = "Nothing typed yet.";
          if (clickCount === 0 && activeTheme === "default") {
            status.textContent = "Waiting for the first click.";
          }
          return;
        }

        feedbackHint.textContent = `Preview: ${message}`;
        status.textContent = `Custom note: ${message}`;
      }

      function setTheme(theme) {
        activeTheme = theme;
        document.body.classList.toggle("green-mode", theme === "green");
        document.body.classList.toggle("blue-mode", theme === "blue");
        themeToggleButton.textContent = theme === "green" ? "Show Original" : "Go Green";
        blueThemeToggleButton.textContent = theme === "blue" ? "Show Original" : "Go Blue";

        if (theme === "green") {
          setStatusMessage("Green gradient mode is active.");
          return;
        }

        if (theme === "blue") {
          setStatusMessage("Blue gradient mode is active.");
          return;
        }

        setStatusMessage("Original colorful gradient is active.");
      }

      button.addEventListener("click", () => {
        clickCount += 1;
        setStatusMessage(
          clickCount === 1
            ? "Button clicked once."
            : `Button clicked ${clickCount} times.`,
        );
      });

      themeToggleButton.addEventListener("click", () => {
        setTheme(activeTheme === "green" ? "default" : "green");
      });

      blueThemeToggleButton.addEventListener("click", () => {
        setTheme(activeTheme === "blue" ? "default" : "blue");
      });

      feedbackTextarea.addEventListener("input", updateFeedbackState);
    </script>
  </body>
</html>
