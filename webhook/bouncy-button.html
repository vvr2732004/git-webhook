<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncy Button Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --sky-top: #6dd5fa;
        --sky-mid: #b721ff;
        --sky-bottom: #ffb703;
        --card-start: rgba(255, 255, 255, 0.3);
        --card-end: rgba(255, 255, 255, 0.12);
        --button-start: #ff4d6d;
        --button-mid: #ff8a00;
        --button-end: #ffd166;
        --button-shadow: #9f2a66;
        --green-start: #34d399;
        --green-mid: #22c55e;
        --green-end: #15803d;
        --green-shadow: #166534;
        --blue-start: #60a5fa;
        --blue-mid: #2563eb;
        --blue-end: #1e3a8a;
        --blue-shadow: #1d4ed8;
        --custom-start: #fde68a;
        --custom-mid: #f97316;
        --custom-end: #7c2d12;
        --custom-shadow: #c2410c;
        --custom-glow-top: rgba(255, 255, 255, 0.42);
        --custom-glow-side: rgba(255, 196, 120, 0.36);
        --custom-glow-bottom: rgba(249, 115, 22, 0.28);
        --text: #1f1147;
        --text-soft: #422f72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.55), transparent 22%),
          radial-gradient(circle at 80% 15%, rgba(255, 214, 102, 0.5), transparent 20%),
          radial-gradient(circle at 75% 80%, rgba(255, 77, 109, 0.35), transparent 24%),
          linear-gradient(135deg, var(--sky-top), var(--sky-mid) 52%, var(--sky-bottom));
        color: var(--text);
        transition: background 220ms ease;
      }

      body.green-mode {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.4), transparent 22%),
          radial-gradient(circle at 82% 14%, rgba(187, 247, 208, 0.35), transparent 22%),
          radial-gradient(circle at 72% 84%, rgba(34, 197, 94, 0.28), transparent 26%),
          linear-gradient(135deg, #d9f99d, #22c55e 48%, #14532d);
      }

      body.blue-mode {
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.42), transparent 22%),
          radial-gradient(circle at 82% 16%, rgba(147, 197, 253, 0.36), transparent 22%),
          radial-gradient(circle at 70% 82%, rgba(56, 189, 248, 0.28), transparent 26%),
          linear-gradient(135deg, #dbeafe, #38bdf8 44%, #1d4ed8 72%, #172554);
      }

      body.custom-mode {
        background:
          radial-gradient(circle at 18% 18%, var(--custom-glow-top), transparent 22%),
          radial-gradient(circle at 82% 16%, var(--custom-glow-side), transparent 22%),
          radial-gradient(circle at 70% 82%, var(--custom-glow-bottom), transparent 26%),
          linear-gradient(135deg, var(--custom-start), var(--custom-mid) 48%, var(--custom-end));
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(16px);
        opacity: 0.45;
        pointer-events: none;
      }

      body::before {
        width: 15rem;
        height: 15rem;
        top: 8%;
        left: 8%;
        background: linear-gradient(180deg, #ffffff, #ffd166);
      }

      body::after {
        width: 18rem;
        height: 18rem;
        right: -3rem;
        bottom: -2rem;
        background: linear-gradient(180deg, #ff7eb6, #7afcff);
      }

      .card {
        width: min(92vw, 34rem);
        padding: 2.25rem;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 2rem;
        background: linear-gradient(180deg, var(--card-start), var(--card-end));
        box-shadow: 0 1.5rem 4rem rgba(31, 17, 71, 0.24);
        backdrop-filter: blur(14px);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .custom-theme-row {
        margin-top: 1rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.85rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        letter-spacing: 0.03em;
        text-shadow: 0 0.25rem 1rem rgba(255, 255, 255, 0.35);
      }

      p {
        margin: 0 0 1.75rem;
        line-height: 1.5;
        color: var(--text-soft);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 1rem 2rem;
        font-size: 1.02rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #fffdf6;
        background: linear-gradient(135deg, var(--button-start), var(--button-mid), var(--button-end));
        box-shadow:
          0 0.6rem 0 var(--button-shadow),
          0 1rem 2rem rgba(159, 42, 102, 0.32);
        cursor: pointer;
        transform: translateY(0);
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        animation: bounce 1.6s ease-in-out infinite;
      }

      button:hover {
        transform: translateY(-0.2rem) scale(1.02);
        filter: saturate(1.12) brightness(1.03);
      }

      button:active {
        transform: translateY(0.35rem);
        box-shadow:
          0 0.18rem 0 var(--button-shadow),
          0 0.45rem 0.9rem rgba(159, 42, 102, 0.2);
      }

      .toggle-button {
        background: linear-gradient(135deg, var(--green-start), var(--green-mid), var(--green-end));
        box-shadow:
          0 0.6rem 0 var(--green-shadow),
          0 1rem 2rem rgba(21, 128, 61, 0.28);
        animation-duration: 1.9s;
      }

      .toggle-button:active {
        box-shadow:
          0 0.18rem 0 var(--green-shadow),
          0 0.45rem 0.9rem rgba(21, 128, 61, 0.18);
      }

      .blue-toggle-button {
        background: linear-gradient(135deg, var(--blue-start), var(--blue-mid), var(--blue-end));
        box-shadow:
          0 0.6rem 0 var(--blue-shadow),
          0 1rem 2rem rgba(29, 78, 216, 0.28);
        animation-duration: 2.1s;
      }

      .blue-toggle-button:active {
        box-shadow:
          0 0.18rem 0 var(--blue-shadow),
          0 0.45rem 0.9rem rgba(29, 78, 216, 0.18);
      }

      .custom-toggle-button {
        background: linear-gradient(135deg, var(--custom-start), var(--custom-mid), var(--custom-end));
        box-shadow:
          0 0.6rem 0 var(--custom-shadow),
          0 1rem 2rem rgba(194, 65, 12, 0.28);
        animation-duration: 2.3s;
      }

      .custom-toggle-button:active {
        box-shadow:
          0 0.18rem 0 var(--custom-shadow),
          0 0.45rem 0.9rem rgba(194, 65, 12, 0.18);
      }

      .picker-label {
        font-weight: 700;
        color: var(--text-soft);
      }

      input[type="color"] {
        width: 4.5rem;
        height: 3rem;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        cursor: pointer;
        box-shadow: 0 0.6rem 1.25rem rgba(31, 17, 71, 0.14);
      }

      .status {
        margin-top: 1.25rem;
        min-height: 1.5rem;
        font-weight: 600;
        color: var(--text-soft);
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        20% {
          transform: translateY(-0.35rem);
        }
        40% {
          transform: translateY(0);
        }
        60% {
          transform: translateY(-0.18rem);
        }
        80% {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bouncy Button</h1>
      <p>Colorful gradient prototype to test Jira issue to PR linking in this repository.</p>
      <div class="controls">
        <button id="bounceButton" type="button">Click Me</button>
        <button class="toggle-button" id="greenThemeButton" type="button">Go Green</button>
        <button class="blue-toggle-button" id="blueThemeButton" type="button">Go Blue</button>
      </div>
      <div class="custom-theme-row">
        <label class="picker-label" for="customColorPicker">Pick a color</label>
        <input id="customColorPicker" type="color" value="#f97316" />
        <button class="custom-toggle-button" id="customThemeButton" type="button">Use My Color</button>
      </div>
      <div class="status" id="status">Waiting for the first click.</div>
    </main>
    <script>
      const button = document.getElementById("bounceButton");
      const greenThemeButton = document.getElementById("greenThemeButton");
      const blueThemeButton = document.getElementById("blueThemeButton");
      const customThemeButton = document.getElementById("customThemeButton");
      const customColorPicker = document.getElementById("customColorPicker");
      const status = document.getElementById("status");
      let clickCount = 0;
      let activeTheme = "default";

      function hexToRgb(hex) {
        const normalized = hex.replace("#", "");
        const value = normalized.length === 3
          ? normalized.split("").map((char) => char + char).join("")
          : normalized;

        return {
          r: Number.parseInt(value.slice(0, 2), 16),
          g: Number.parseInt(value.slice(2, 4), 16),
          b: Number.parseInt(value.slice(4, 6), 16),
        };
      }

      function mix(color, target, ratio) {
        return {
          r: Math.round(color.r + (target.r - color.r) * ratio),
          g: Math.round(color.g + (target.g - color.g) * ratio),
          b: Math.round(color.b + (target.b - color.b) * ratio),
        };
      }

      function rgbToCss(color) {
        return `rgb(${color.r}, ${color.g}, ${color.b})`;
      }

      function updateCustomThemeColors(hex) {
        const base = hexToRgb(hex);
        const light = mix(base, { r: 255, g: 255, b: 255 }, 0.58);
        const dark = mix(base, { r: 12, g: 18, b: 38 }, 0.52);
        const shadow = mix(base, { r: 38, g: 18, b: 12 }, 0.35);
        const glowSide = mix(base, { r: 255, g: 255, b: 255 }, 0.42);
        const glowBottom = mix(base, { r: 255, g: 255, b: 255 }, 0.16);

        document.documentElement.style.setProperty("--custom-start", rgbToCss(light));
        document.documentElement.style.setProperty("--custom-mid", rgbToCss(base));
        document.documentElement.style.setProperty("--custom-end", rgbToCss(dark));
        document.documentElement.style.setProperty("--custom-shadow", rgbToCss(shadow));
        document.documentElement.style.setProperty("--custom-glow-side", rgbToCss(glowSide));
        document.documentElement.style.setProperty("--custom-glow-bottom", rgbToCss(glowBottom));
      }

      function setTheme(theme) {
        activeTheme = theme;
        document.body.classList.toggle("green-mode", theme === "green");
        document.body.classList.toggle("blue-mode", theme === "blue");
        document.body.classList.toggle("custom-mode", theme === "custom");

        greenThemeButton.textContent = theme === "green" ? "Show Original" : "Go Green";
        blueThemeButton.textContent = theme === "blue" ? "Show Original" : "Go Blue";
        customThemeButton.textContent = theme === "custom" ? "Show Original" : "Use My Color";

        if (theme === "green") {
          status.textContent = "Green gradient mode is active.";
          return;
        }

        if (theme === "blue") {
          status.textContent = "Blue gradient mode is active.";
          return;
        }

        if (theme === "custom") {
          status.textContent = `Custom color mode is active for ${customColorPicker.value.toUpperCase()}.`;
          return;
        }

        status.textContent = "Original colorful gradient is active.";
      }

      updateCustomThemeColors(customColorPicker.value);

      button.addEventListener("click", () => {
        clickCount += 1;
        status.textContent =
          clickCount === 1
            ? "Button clicked once."
            : `Button clicked ${clickCount} times.`;
      });

      greenThemeButton.addEventListener("click", () => {
        setTheme(activeTheme === "green" ? "default" : "green");
      });

      blueThemeButton.addEventListener("click", () => {
        setTheme(activeTheme === "blue" ? "default" : "blue");
      });

      customThemeButton.addEventListener("click", () => {
        setTheme(activeTheme === "custom" ? "default" : "custom");
      });

      customColorPicker.addEventListener("input", () => {
        updateCustomThemeColors(customColorPicker.value);

        if (activeTheme === "custom") {
          status.textContent = `Custom color mode is active for ${customColorPicker.value.toUpperCase()}.`;
        }
      });
    </script>
  </body>
</html>
