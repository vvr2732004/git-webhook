<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncy Button Prototype</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #fff6db;
        --bg-end: #ffd6a5;
        --button-start: #ff6b35;
        --button-end: #ff8c42;
        --button-shadow: #c94f24;
        --text: #40210f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, var(--bg-start), var(--bg-end));
        color: var(--text);
      }

      .card {
        width: min(90vw, 28rem);
        padding: 2rem;
        text-align: center;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 1.25rem 3rem rgba(64, 33, 15, 0.18);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }

      p {
        margin: 0 0 1.75rem;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 1rem 2rem;
        font-size: 1.05rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(180deg, var(--button-end), var(--button-start));
        box-shadow: 0 0.5rem 0 var(--button-shadow);
        cursor: pointer;
        transform: translateY(0);
        transition: transform 120ms ease, box-shadow 120ms ease;
        animation: bounce 1.6s ease-in-out infinite;
      }

      button:hover {
        transform: translateY(-0.2rem) scale(1.02);
      }

      button:active {
        transform: translateY(0.35rem);
        box-shadow: 0 0.15rem 0 var(--button-shadow);
      }

      .status {
        margin-top: 1.25rem;
        min-height: 1.5rem;
        font-weight: 600;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        20% {
          transform: translateY(-0.35rem);
        }
        40% {
          transform: translateY(0);
        }
        60% {
          transform: translateY(-0.18rem);
        }
        80% {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Bouncy Button</h1>
      <p>Simple HTML prototype to test Jira issue to PR linking in this repository.</p>
      <button id="bounceButton" type="button">Click Me</button>
      <div class="status" id="status">Waiting for the first click.</div>
    </main>
    <script>
      const button = document.getElementById("bounceButton");
      const status = document.getElementById("status");
      let clickCount = 0;

      button.addEventListener("click", () => {
        clickCount += 1;
        status.textContent =
          clickCount === 1
            ? "Button clicked once."
            : `Button clicked ${clickCount} times.`;
      });
    </script>
  </body>
</html>
